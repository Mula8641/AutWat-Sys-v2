[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DSIMULATED_TIME
    -Iinclude
    -Wall
    -Wextra
lib_deps =
    arduino-libraries/LiquidCrystal
    adafruit/DHT sensor library
    h2zero/NimBLE-Arduino@^2.5.1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Iinclude
