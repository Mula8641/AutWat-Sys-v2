[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DSIMULATED_TIME
    -DAUTWAT_NO_BLE
    -DAUTWAT_RELAY_ACTIVE_HIGH
    -Iinclude
    -Wall
    -Wextra
lib_deps =
    arduino-libraries/LiquidCrystal
    adafruit/DHT sensor library
    h2zero/NimBLE-Arduino@^2.5.1

; Same firmware with the real BLE stack; Wokwi cannot emulate the BT controller (watchdog reset).
[env:esp32dev_ble]
extends = env:esp32dev
build_unflags = -DAUTWAT_NO_BLE -DAUTWAT_RELAY_ACTIVE_HIGH

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Iinclude
